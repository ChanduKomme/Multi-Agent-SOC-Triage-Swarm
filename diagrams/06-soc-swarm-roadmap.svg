<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1250" viewBox="0 0 1900 1250">
<rect width="1900" height="1250" fill="#f8fafc"/>
<text x="60" y="62" font-size="32" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Multi-Agent SOC Triage Swarm — build roadmap</text>
<text x="60" y="96" font-size="16" font-weight="400" fill="#64748b" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Project 09. Suggested milestones for building and verifying the triage swarm.</text>
<text x="460" y="190" font-size="13" font-weight="600" fill="#64748b" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Indicative week</text>
<line x1="460" y1="205" x2="460" y2="796" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="460.0" y="228" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif">W1</text>
<line x1="564" y1="205" x2="564" y2="796" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="564.4444444444445" y="228" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif">W2</text>
<line x1="669" y1="205" x2="669" y2="796" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="668.8888888888889" y="228" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif">W3</text>
<line x1="773" y1="205" x2="773" y2="796" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="773.3333333333333" y="228" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif">W4</text>
<line x1="878" y1="205" x2="878" y2="796" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="877.7777777777778" y="228" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif">W5</text>
<line x1="982" y1="205" x2="982" y2="796" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="982.2222222222223" y="228" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif">W6</text>
<line x1="1087" y1="205" x2="1087" y2="796" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="1086.6666666666665" y="228" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif">W7</text>
<line x1="1191" y1="205" x2="1191" y2="796" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="1191.111111111111" y="228" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif">W8</text>
<line x1="1296" y1="205" x2="1296" y2="796" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="1295.5555555555557" y="228" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif">W9</text>
<line x1="1400" y1="205" x2="1400" y2="796" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="1400.0" y="228" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif"></text>
<text x="60" y="282" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Phase 0</text>
<text x="160" y="282" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Setup</text>
<rect x="460.0" y="260" width="60.7" height="32" rx="6" fill="#bfdbfe" stroke="#ffffff" stroke-width="2"/>
<text x="1420" y="282" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">venv, requirements, .env, sample alerts + incident corpus</text>
<text x="60" y="360" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Phase 1</text>
<text x="160" y="360" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Orchestrator + stub agents</text>
<rect x="522.7" y="338" width="123.3" height="32" rx="6" fill="#93c5fd" stroke="#ffffff" stroke-width="2"/>
<text x="1420" y="360" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">handoff sequence runs end to end with hard-coded stub findings</text>
<line x1="60" y1="320" x2="1840" y2="320" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="438" font-size="17" font-weight="700" fill="#60a5fa" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Phase 2</text>
<text x="160" y="438" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Enrichment Agent — MCP tools + RAG</text>
<rect x="648.0" y="416" width="206.9" height="32" rx="6" fill="#60a5fa" stroke="#ffffff" stroke-width="2"/>
<text x="1420" y="438" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">MCP stdio server, tool loop, retrieval over past incidents</text>
<line x1="60" y1="398" x2="1840" y2="398" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="516" font-size="17" font-weight="700" fill="#3b82f6" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Phase 3</text>
<text x="160" y="516" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Correlation Agent — grouping logic</text>
<rect x="856.9" y="494" width="112.9" height="32" rx="6" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
<text x="1420" y="516" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">alerts collapse into candidate incidents with justified severity</text>
<line x1="60" y1="476" x2="1840" y2="476" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="594" font-size="17" font-weight="700" fill="#2563eb" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Phase 4</text>
<text x="160" y="594" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Response Agent + human approval gate</text>
<rect x="971.8" y="572" width="123.3" height="32" rx="6" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
<text x="1420" y="594" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">gated recommendations receive an analyst decision</text>
<line x1="60" y1="554" x2="1840" y2="554" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="672" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Phase 5</text>
<text x="160" y="672" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Consolidated reporting</text>
<rect x="1097.1" y="650" width="92.0" height="32" rx="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/>
<text x="1420" y="672" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">out/soc_triage_report.md with evidence and usage</text>
<line x1="60" y1="632" x2="1840" y2="632" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="750" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Phase 6</text>
<text x="160" y="750" font-size="17" font-weight="600" fill="#0f172a" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Guardrails: trust, poisoning, cost</text>
<rect x="1191.1" y="728" width="165.1" height="32" rx="6" fill="#1e3a8a" stroke="#ffffff" stroke-width="2"/>
<text x="1420" y="750" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">flag untrusted text and enforce the call budget</text>
<line x1="60" y1="710" x2="1840" y2="710" stroke="#e2e8f0" stroke-width="1"/>
<path d="M 1191 802 l 11 11 l -11 11 l -11 -11 z" fill="#b45309"/>
<text x="1191.111111111111" y="848" font-size="13" font-weight="600" fill="#b45309" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif">first full run</text>
<path d="M 1358 802 l 11 11 l -11 11 l -11 -11 z" fill="#b45309"/>
<text x="1358.2222222222222" y="848" font-size="13" font-weight="600" fill="#b45309" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif">injection test passes</text>
<rect x="460" y="876" width="940" height="26" rx="13" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="476.0" y="894" font-size="13" font-weight="600" fill="#b45309" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">Guardrails are not only Phase 6 — fence untrusted text and cap the budget from Phase 1, or you will debug a runaway loop instead of a swarm</text>
<text x="60" y="946" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">What each phase teaches</text>
<text x="62" y="978" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">P1  Why an orchestrator that owns the handoffs beats one agent with every tool.</text>
<text x="62" y="1003" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">P2  MCP as a policy boundary: the allowlist and call ceiling live in the client, not the server.</text>
<text x="62" y="1028" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">P3  Correlation is where a single hallucinated enrichment can poison a whole incident.</text>
<text x="62" y="1053" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">P4  Autonomy gating: the model may propose containment, only a human may authorise it.</text>
<text x="62" y="1078" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">P5  A report an analyst will actually read — evidence and precedent, not just a verdict.</text>
<text x="62" y="1103" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif">P6  Trust boundaries between agents, shared-memory poisoning, cost/loop circuit breakers.</text>
<text x="1840" y="1224" font-size="13" font-weight="400" fill="#64748b" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif">Adapted from github.com/jassics/ai-security-projects — Project 09</text>
</svg>